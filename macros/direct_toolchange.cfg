# Configurable, box.cfg-style workflow built from the hidden _BOX_* direct
# commands in klipper_extra/creality_cfs.py. This is deliberately separate
# from toolchange_draft.cfg, which uses the wrapped CFS_RETRUDE/CFS_EXTRUDE
# processes.
#
# IMPORTANT: every XY motion coordinate and minimum_z starts at -1. The public
# macro refuses to run until they are calibrated on the actual printer. Do not
# copy positions from another K1/K1 Max; this repository has already recorded
# a real frame collision caused by doing exactly that. Before XY travel it uses
# max(current_z, minimum_z) + z_hop, never a fixed downward Z move.

[gcode_macro CFS_DIRECT_CONFIG]
description: Configuration holder for CFS_DIRECT_TOOLCHANGE; calling it does nothing.
variable_cut_x: 42
variable_cut_y: 301
variable_retreat_x: 42
variable_retreat_y: 260
variable_extrude_x: 202
variable_extrude_y: 297
variable_minimum_z: 45
variable_z_hop: 1.0
variable_travel_speed: 6000.0
variable_cut_speed: 18000.0
variable_cut_accel: 20000.0
variable_cut_repetitions: 2
variable_pre_cut_retract: 27.0
variable_pre_cut_retract_speed: 1980.0
variable_buffer_chunk: 20.0
variable_post_cut_retract: 120.0
variable_post_cut_retract_speed: 500.0
variable_extrude_poll_count: 4
variable_poll_delay_ms: 250
variable_prime_e1: 10.0
variable_prime_e1_speed: 120.0
variable_prime_e2: 10.0
variable_prime_e2_speed: 300.0
variable_handoff_push: 9.0
variable_handoff_speed: 12000.0
variable_purge_length: 110.0
variable_purge_speed: 500.0
variable_purge_wipe_accel: 15000.0
variable_purge_wipe_speed: 12000.0
variable_purge_wipe_repetitions: 3
variable_toolhead_sensor_name: 'extruder_sensor'
variable_home_command: 'G28'
gcode:
    {action_respond_info("CFS_DIRECT_CONFIG is a settings holder; run CFS_DIRECT_TOOLCHANGE [FROM=<A|B|C|D>] [TO=<A|B|C|D>]")}

[gcode_macro CFS_DIRECT_TOOLCHANGE]
description: CFS_DIRECT_TOOLCHANGE [TO=<A|B|C|D>] [FROM=<A|B|C|D>] [TEMP=<C>] [PURGE=<mm>] - configurable low-level toolchange or unload.
gcode:
    {% set cfg = printer["gcode_macro CFS_DIRECT_CONFIG"] %}
    {% set saved = printer.save_variables.variables.cfs_active_slot|default('')|upper %}
    {% set from_slot = params.FROM|default(saved)|upper %}
    {% set to_slot = params.TO|default('')|upper %}
    {% set unload_coords = [cfg.cut_x, cfg.cut_y, cfg.retreat_x, cfg.retreat_y, cfg.minimum_z] %}
    {% set coords = unload_coords + [cfg.extrude_x, cfg.extrude_y] if to_slot in ['A', 'B', 'C', 'D'] else unload_coords %}
    {% set ns = namespace(uncalibrated=false) %}
    {% for coordinate in coords %}
        {% if coordinate|float < 0 %}
            {% set ns.uncalibrated = true %}
        {% endif %}
    {% endfor %}

    {% if to_slot and to_slot not in ['A', 'B', 'C', 'D'] %}
        {action_raise_error("CFS_DIRECT_TOOLCHANGE: TO must be one of A, B, C, D")}
    {% elif not to_slot and from_slot not in ['A', 'B', 'C', 'D'] %}
        {action_raise_error("CFS_DIRECT_TOOLCHANGE: provide FROM for unload or TO for load")}
    {% elif ns.uncalibrated %}
        {action_raise_error("CFS_DIRECT_TOOLCHANGE: calibrate cut, retreat, extrude, and minimum-Z settings in CFS_DIRECT_CONFIG before use")}
    {% elif from_slot == to_slot %}
        {action_respond_info("CFS_DIRECT_TOOLCHANGE: requested slot is already active")}
    {% else %}
        SAVE_GCODE_STATE NAME=CFS_DIRECT_TOOLCHANGE
        {% if not "xyz" in printer.toolhead.homed_axes %}
            {cfg.home_command}
        {% endif %}
        {% if from_slot in ['A', 'B', 'C', 'D'] and to_slot in ['A', 'B', 'C', 'D'] %}
            _CFS_DIRECT_SEQUENCE FROM={from_slot} TO={to_slot} TEMP={params.TEMP|default(220)} PURGE={params.PURGE|default(cfg.purge_length)}
        {% elif from_slot in ['A', 'B', 'C', 'D'] %}
            _CFS_DIRECT_SEQUENCE FROM={from_slot} TEMP={params.TEMP|default(220)} PURGE={params.PURGE|default(cfg.purge_length)}
        {% else %}
            {action_respond_info("CFS_DIRECT_TOOLCHANGE: no active FROM slot; skipping unload")}
            _CFS_DIRECT_SEQUENCE TO={to_slot} TEMP={params.TEMP|default(220)} PURGE={params.PURGE|default(cfg.purge_length)}
        {% endif %}
        RESTORE_GCODE_STATE NAME=CFS_DIRECT_TOOLCHANGE MOVE=0
        {% if to_slot in ['A', 'B', 'C', 'D'] %}
            _CFS_DIRECT_FINISH TO={to_slot}
        {% else %}
            SAVE_VARIABLE VARIABLE=cfs_active_slot VALUE='""'
            {action_respond_info("CFS_DIRECT_TOOLCHANGE: unload complete; active slot cleared")}
        {% endif %}
    {% endif %}

[gcode_macro _CFS_DIRECT_SEQUENCE]
description: Internal post-home clearance calculation and direct workflow dispatch.
gcode:
    {% set cfg = printer["gcode_macro CFS_DIRECT_CONFIG"] %}
    {% set from_slot = params.FROM|default('')|upper %}
    {% set to_slot = params.TO|default('')|upper %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set minimum_z = cfg.minimum_z|float %}
    {% set z_hop = cfg.z_hop|float %}
    {% set clearance_z = ([current_z, minimum_z]|max) + z_hop %}
    {% set position_max = printer.configfile.settings.stepper_z.position_max|float %}

    {% if minimum_z < 0 %}
        {action_raise_error("_CFS_DIRECT_SEQUENCE: minimum_z must be calibrated before use")}
    {% elif z_hop <= 0 %}
        {action_raise_error("_CFS_DIRECT_SEQUENCE: z_hop must be greater than zero")}
    {% elif clearance_z > position_max %}
        {action_raise_error("_CFS_DIRECT_SEQUENCE: required clearance Z%.3f exceeds Z maximum %.3f" % (clearance_z, position_max))}
    {% else %}
        {% if from_slot in ['A', 'B', 'C', 'D'] %}
            _CFS_DIRECT_UNLOAD FROM={from_slot} TEMP={params.TEMP|default(220)} SAFE_Z={clearance_z}
        {% endif %}
        {% if to_slot in ['A', 'B', 'C', 'D'] %}
            _CFS_DIRECT_LOAD TO={to_slot} TEMP={params.TEMP|default(220)} PURGE={params.PURGE|default(cfg.purge_length)} SAFE_Z={clearance_z}
        {% endif %}
    {% endif %}

[gcode_macro _CFS_DIRECT_UNLOAD]
description: Internal low-level unload/cut sequence used by CFS_DIRECT_TOOLCHANGE.
gcode:
    {% set cfg = printer["gcode_macro CFS_DIRECT_CONFIG"] %}
    {% set from_slot = params.FROM|upper %}
    {% set safe_z = params.SAFE_Z|float %}
    {% set temperature = params.TEMP|default(220)|float %}
    {% set total = cfg.pre_cut_retract|float %}
    {% set chunk = cfg.buffer_chunk|float %}
    {% set repetitions = cfg.cut_repetitions|int %}
    {% set full_chunks = (total / chunk)|int if chunk > 0 else 0 %}
    {% set remainder = total - (full_chunks * chunk) if chunk > 0 else total %}

    {% if from_slot not in ['A', 'B', 'C', 'D'] %}
        {action_raise_error("_CFS_DIRECT_UNLOAD: FROM must be one of A, B, C, D")}
    {% elif safe_z < 0 %}
        {action_raise_error("_CFS_DIRECT_UNLOAD: SAFE_Z must be non-negative")}
    {% elif chunk <= 0 %}
        {action_raise_error("_CFS_DIRECT_UNLOAD: buffer_chunk must be greater than zero")}
    {% elif not printer.extruder.can_extrude and temperature <= 0 %}
        {action_raise_error("_CFS_DIRECT_UNLOAD: hotend is too cold; heat it first or pass TEMP=<C>")}
    {% else %}
        {% if not printer.extruder.can_extrude or temperature > 0 %}
            M109 S{temperature}
        {% endif %}

        # Pull back the filament in preparation for cutting
        _BOX_SET_PRE_LOADING ACTION=CLOSE
        _BOX_SET_BOX_MODE MODE=IDLE
        M83
        {% for unused in range(full_chunks) %}
            _BOX_RETRUDE_PROCESS SLOT={from_slot} TRIGGER=BUFFER
            G1 E-{chunk} F{cfg.pre_cut_retract_speed}
            M400
        {% endfor %}
        {% if remainder > 0 %}
            _BOX_RETRUDE_PROCESS SLOT={from_slot} TRIGGER=BUFFER
            G1 E-{remainder} F{cfg.pre_cut_retract_speed}
            M400
        {% endif %}

        G90
        G1 Z{safe_z} F{cfg.travel_speed/2}
        M400

        {% for unused in range(repetitions) %}
            G1 X{cfg.cut_x} Y{cfg.cut_y} F{cfg.cut_speed}
            M400
            G0 E-1 F{cfg.pre_cut_retract_speed}
            G1 X{cfg.retreat_x} Y{cfg.retreat_y} F{cfg.travel_speed}
            M400
        {% endfor %}
        
        # Move to the extrude position for post-cut processing
        G1 X{cfg.retreat_x} Y{cfg.retreat_y} F{cfg.travel_speed}
        M400
        G1 X{cfg.extrude_x} Y{cfg.retreat_y} F{cfg.travel_speed}
        M400
        G1 X{cfg.extrude_x} Y{cfg.extrude_y} F{cfg.travel_speed/4}
        M400

        _BOX_RETRUDE_PROCESS SLOT={from_slot} TRIGGER=MATERIAL
        M83
        G1 E-{cfg.post_cut_retract} F{cfg.post_cut_retract_speed}
        M400
        _BOX_SET_BOX_MODE MODE=IDLE
    {% endif %}

[gcode_macro _CFS_DIRECT_LOAD]
description: Internal staged low-level load sequence used by CFS_DIRECT_TOOLCHANGE.
gcode:
    {% set cfg = printer["gcode_macro CFS_DIRECT_CONFIG"] %}
    {% set to_slot = params.TO|upper %}
    {% set safe_z = params.SAFE_Z|float %}
    {% set temperature = params.TEMP|default(220)|float %}
    {% set purge = params.PURGE|default(cfg.purge_length)|float %}

    {% if to_slot not in ['A', 'B', 'C', 'D'] %}
        {action_raise_error("_CFS_DIRECT_LOAD: TO must be one of A, B, C, D")}
    {% elif cfg.extrude_x|float < 0 or cfg.extrude_y|float < 0 %}
        {action_raise_error("_CFS_DIRECT_LOAD: calibrate extrude_x and extrude_y first")}
    {% elif safe_z < 0 %}
        {action_raise_error("_CFS_DIRECT_LOAD: SAFE_Z must be non-negative")}
    {% elif not printer.extruder.can_extrude and temperature <= 0 %}
        {action_raise_error("_CFS_DIRECT_LOAD: hotend is too cold; heat it first or pass TEMP=<C>")}
    {% else %}
        {% set original_accel = printer.toolhead.max_accel|float %}
        {% if temperature > 0 %}
            M109 S{temperature}
        {% endif %}
        G90
        G1 Z{safe_z} F{cfg.travel_speed}
        M400
        G1 X{cfg.extrude_x} Y{cfg.retreat_y} F{cfg.travel_speed}
        M400
        G1 X{cfg.extrude_x} Y{cfg.extrude_y} F{cfg.travel_speed/4}
        M400

        _BOX_SET_PRE_LOADING ACTION=CLOSE
        _BOX_SET_BOX_MODE MODE=IDLE
        _BOX_CTRL_CONNECTION_MOTOR_ACTION ACTION=EXTRUDE
        _BOX_TIGHTEN_UP_ENABLE ENABLE=ENABLE
        _BOX_EXTRUDE_PROCESS SLOT={to_slot} STAGE=0 AMOUNT=0
        G4 P300
        _BOX_EXTRUDE_PROCESS SLOT={to_slot} STAGE=4 AMOUNT=0
        G4 P300
        
        {% for unused in range(cfg.extrude_poll_count|int) %}
            _BOX_EXTRUDE_PROCESS SLOT={to_slot} STAGE=5 AMOUNT=0
            G4 P{cfg.poll_delay_ms}
        {% endfor %}

        M83
        G1 E{cfg.prime_e1} F{cfg.prime_e1_speed}
        _BOX_EXTRUDE_PROCESS SLOT={to_slot} STAGE=6 AMOUNT=0
        G4 P300
        G1 E{cfg.prime_e2} F{cfg.prime_e2_speed}
        _BOX_EXTRUDE_PROCESS SLOT={to_slot} STAGE=7 AMOUNT=3
        _BOX_SET_BOX_MODE SLOT={to_slot} MODE=PRINT
        G1 E{cfg.handoff_push} F{cfg.handoff_speed}
        M400

        {% if purge > 0 %}
            G1 E{purge} F{cfg.purge_speed}
            M400
        {% endif %}
        _BOX_TIGHTEN_UP_ENABLE ENABLE=DISABLE
        _BOX_CTRL_CONNECTION_MOTOR_ACTION ACTION=STOP

        SET_VELOCITY_LIMIT ACCEL={cfg.purge_wipe_accel}
        {% for unused in range(cfg.purge_wipe_repetitions|int) %}
            G1 X{cfg.extrude_x} Y{cfg.retreat_y} F{cfg.purge_wipe_speed}
            G1 X{cfg.extrude_x} Y{cfg.extrude_y} F{cfg.purge_wipe_speed}
        {% endfor %}
        G1 X{cfg.extrude_x} Y{cfg.retreat_y} F{cfg.purge_wipe_speed}
        M400
        SET_VELOCITY_LIMIT ACCEL={original_accel}
    {% endif %}

[gcode_macro _CFS_DIRECT_FINISH]
description: Internal post-load sensor check and active-slot persistence.
gcode:
    {% set cfg = printer["gcode_macro CFS_DIRECT_CONFIG"] %}
    {% set to_slot = params.TO|upper %}
    {% set sensor = printer["filament_switch_sensor " ~ cfg.toolhead_sensor_name] %}
    {% if sensor.filament_detected %}
        SAVE_VARIABLE VARIABLE=cfs_active_slot VALUE='"{to_slot}"'
        {action_respond_info("CFS_DIRECT_TOOLCHANGE: complete; toolhead sensor confirmed slot %s" % to_slot)}
    {% else %}
        {action_raise_error("CFS_DIRECT_TOOLCHANGE: load finished but the toolhead sensor is clear; active slot was not saved")}
    {% endif %}

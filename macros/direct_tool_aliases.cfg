# Optional aliases for direct_toolchange.cfg. Do not include this file if the
# printer or another macro package already defines T0-T3. It intentionally has
# no rename_existing entries: conflicting tool macros should fail visibly at
# config load rather than silently changing slicer behavior.

[gcode_macro T0]
description: Select CFS slot A through CFS_DIRECT_TOOLCHANGE.
gcode:
    CFS_DIRECT_TOOLCHANGE TO=A {rawparams}

[gcode_macro T1]
description: Select CFS slot B through CFS_DIRECT_TOOLCHANGE.
gcode:
    CFS_DIRECT_TOOLCHANGE TO=B {rawparams}

[gcode_macro T2]
description: Select CFS slot C through CFS_DIRECT_TOOLCHANGE.
gcode:
    CFS_DIRECT_TOOLCHANGE TO=C {rawparams}

[gcode_macro T3]
description: Select CFS slot D through CFS_DIRECT_TOOLCHANGE.
gcode:
    CFS_DIRECT_TOOLCHANGE TO=D {rawparams}
